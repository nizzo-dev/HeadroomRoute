<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Headroom Route</title>
  <style>
/* ===== Headroom Route console ===== */
:root {
  --bg: #12141a;
  --bg-elevated: #1a1d27;
  --bg-card: #222633;
  --border: #2e3445;
  --text: #e8eaef;
  --text-dim: #9aa3b5;
  --accent: #5b8cff;
  --accent-hover: #7aa2ff;
  --good: #3ecf8e;
  --warn: #f0b429;
  --bad: #f07178;
  --radius: 10px;
  --font: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--font);
}
body { display: flex; flex-direction: column; min-height: 100%; }
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 8px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #171a22, var(--bg));
}
.brand { font-weight: 600; letter-spacing: 0.02em; }
.pill {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.pill.good { color: var(--good); border-color: #2a5a44; }
.pill.warn { color: var(--warn); border-color: #5a4a20; }
.pill.bad { color: var(--bad); border-color: #5a3038; }
.tabs {
  display: flex;
  gap: 4px;
  padding: 10px 14px 0;
  border-bottom: 1px solid var(--border);
}
.tabs button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  padding: 8px 14px;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  font: inherit;
}
.tabs button:hover { color: var(--text); background: #1c2030; }
.tabs button.active {
  color: var(--text);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-bottom-color: var(--bg-elevated);
  margin-bottom: -1px;
}
main { flex: 1; overflow: auto; padding: 16px 18px 24px; background: var(--bg-elevated); }
.panel { display: none; }
.panel.active { display: block; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.card h2 {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: none;
  letter-spacing: 0.04em;
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 16px;
}
.kv { display: flex; flex-direction: column; gap: 2px; }
.kv .k { font-size: 11px; color: var(--text-dim); }
.kv .v { font-size: 13px; word-break: break-word; }
.mono { font-variant-numeric: tabular-nums; white-space: pre-wrap; }
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
}
button.btn, label.check {
  appearance: none;
  border: 1px solid var(--border);
  background: #2a3144;
  color: var(--text);
  border-radius: 8px;
  padding: 8px 12px;
  font: inherit;
  cursor: pointer;
}
button.btn:hover { background: #343c52; border-color: #3d4660; }
button.btn.primary {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}
button.btn.primary:hover { background: var(--accent-hover); }
button.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
label.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
label.check input { accent-color: var(--accent); }
.route-list { display: flex; flex-direction: column; gap: 8px; }
.route {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #1b1f2c;
  cursor: pointer;
}
.route:hover { border-color: #3d4660; }
.route.selected { border-color: var(--accent); background: #1e2740; }
.route .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--text-dim); }
.route.selected .mark { background: var(--accent); }
.route .meta { font-size: 12px; color: var(--text-dim); }
.hint { color: var(--text-dim); font-size: 12px; margin: 0 0 10px; }
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
@media (max-width: 640px) {
  .grid-2, .settings-grid { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Headroom Route</div>
    <div id="mode-pill" class="pill">—</div>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" data-tab="status" class="active">状态</button>
    <button type="button" data-tab="routes">上游</button>
    <button type="button" data-tab="ops">运维</button>
    <button type="button" data-tab="settings">设置</button>
  </nav>
  <main>
    <section id="tab-status" class="panel active">
      <div class="card">
        <h2>运行状态</h2>
        <div class="grid-2">
          <div class="kv"><span class="k">模式</span><span class="v" id="st-mode">—</span></div>
          <div class="kv"><span class="k">原因</span><span class="v" id="st-reason">—</span></div>
          <div class="kv"><span class="k">Codex</span><span class="v" id="st-codex">—</span></div>
          <div class="kv"><span class="k">Claude</span><span class="v" id="st-claude">—</span></div>
          <div class="kv"><span class="k">Headroom</span><span class="v" id="st-headroom">—</span></div>
          <div class="kv"><span class="k">恢复建议</span><span class="v" id="st-recovery">—</span></div>
        </div>
      </div>
      <div class="card">
        <h2>当前路由</h2>
        <div class="grid-2">
          <div class="kv"><span class="k">Codex</span><span class="v" id="st-codex-route">—</span></div>
          <div class="kv"><span class="k">Claude</span><span class="v" id="st-claude-route">—</span></div>
        </div>
      </div>
      <div class="card">
        <h2>Headroom 指标</h2>
        <div class="grid-2">
          <div class="kv"><span class="k">Token</span><span class="v mono" id="st-tokens">—</span></div>
          <div class="kv"><span class="k">请求</span><span class="v mono" id="st-requests">—</span></div>
          <div class="kv"><span class="k">统计范围</span><span class="v" id="st-metrics-since">—</span></div>
          <div class="kv"><span class="k">最近错误</span><span class="v" id="st-error">—</span></div>
        </div>
        <div class="row">
          <button type="button" class="btn primary" id="btn-recommended" disabled>暂无建议操作</button>
        </div>
      </div>
    </section>

    <section id="tab-routes" class="panel">
      <p class="hint">点击列表项切换上游。打开「接管上游」后，切换才会写入客户端配置。</p>
      <div class="row" style="margin-top:0;margin-bottom:12px">
        <label class="check"><input type="checkbox" data-command="123" id="chk-manage" /> 接管上游</label>
      </div>
      <div id="route-list" class="route-list"></div>
    </section>

    <section id="tab-ops" class="panel">
      <p class="hint">常用运维开关与动作。同步/重启进行中时对应按钮会禁用。</p>
      <div class="row">
        <label class="check"><input type="checkbox" data-command="104" id="chk-auto" /> 自动故障切换</label>
        <label class="check"><input type="checkbox" data-command="114" id="chk-bypass" /> 旁路 Headroom</label>
      </div>
      <div class="row">
        <button type="button" class="btn" data-command="102">立即检查上游</button>
        <button type="button" class="btn" data-command="101" id="btn-sync">同步 Codex + Claude</button>
        <button type="button" class="btn" data-command="103" id="btn-restart">重启 Headroom</button>
        <button type="button" class="btn" data-command="121">配置故障转移策略…</button>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>任务状态</h2>
        <div class="grid-2">
          <div class="kv"><span class="k">同步</span><span class="v" id="ops-sync">—</span></div>
          <div class="kv"><span class="k">重启</span><span class="v" id="ops-restart">—</span></div>
        </div>
      </div>
    </section>

    <section id="tab-settings" class="panel">
      <div class="row" style="margin-top:0">
        <label class="check"><input type="checkbox" data-command="105" id="chk-startup" /> 随 Windows 启动</label>
        <label class="check"><input type="checkbox" data-command="118" id="chk-autoupdate" /> 每日检查软件更新</label>
        <label class="check"><input type="checkbox" data-command="116" id="chk-showkey" /> 悬浮显示上游 API Key</label>
      </div>
      <div class="settings-grid" style="margin-top:12px">
        <button type="button" class="btn" data-command="107">打开 config.json</button>
        <button type="button" class="btn" data-command="108">打开数据与日志目录</button>
        <button type="button" class="btn" data-command="125">运行启动预检…</button>
        <button type="button" class="btn" data-command="106">复制脱敏诊断报告</button>
        <button type="button" class="btn" data-command="131">创建脱敏诊断 ZIP…</button>
        <button type="button" class="btn" data-command="119">复制 Provider ID 清单</button>
        <button type="button" class="btn" data-command="120">重新加载故障转移规则</button>
        <button type="button" class="btn" data-command="117">清零 Headroom 统计…</button>
        <button type="button" class="btn" data-command="126">预览并应用 CLI 接管…</button>
        <button type="button" class="btn" data-command="127">创建配置备份</button>
        <button type="button" class="btn" data-command="128">恢复配置备份…</button>
        <button type="button" class="btn" data-command="129">导出可移植配置…</button>
        <button type="button" class="btn" data-command="130">导入可移植配置…</button>
        <button type="button" class="btn" data-command="113" id="btn-update">检查软件更新…</button>
        <button type="button" class="btn" data-command="111">重新检测 Headroom 环境…</button>
        <button type="button" class="btn" data-command="115">选择 Headroom Python…</button>
        <button type="button" class="btn" data-command="110">恢复 Codex / Claude 原始配置…</button>
        <button type="button" class="btn" data-command="112">完全卸载并还原…</button>
        <button type="button" class="btn" data-command="122">测试确认悬浮窗</button>
      </div>
    </section>
  </main>
  <script>
/* IPC: wry injects window.ipc.postMessage; WebView2 may use chrome.webview */
(function () {
  function post(msg) {
    var data = typeof msg === "string" ? msg : JSON.stringify(msg);
    try {
      if (window.ipc && typeof window.ipc.postMessage === "function") {
        window.ipc.postMessage(data);
        return;
      }
      if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function") {
        window.chrome.webview.postMessage(data);
        return;
      }
    } catch (e) {}
    console.debug("hr-ipc", data);
  }

  function $(id) { return document.getElementById(id); }

  function setText(id, value) {
    var el = $(id);
    if (el) el.textContent = value == null || value === "" ? "—" : String(value);
  }

  function setCheck(id, on) {
    var el = $(id);
    if (el) el.checked = !!on;
  }

  function setDisabled(id, disabled) {
    var el = $(id);
    if (el) el.disabled = !!disabled;
  }

  function pillClass(mode) {
    if (mode === "正常" || mode === "旁路" || mode === "直连") return "pill good";
    if (mode === "降级") return "pill warn";
    if (mode === "恢复中") return "pill warn";
    return "pill";
  }

  function compact(n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\\.0$/, "") + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\\.0$/, "") + "K";
    return String(n);
  }

  function renderRoutes(routes) {
    var root = $("route-list");
    if (!root) return;
    root.innerHTML = "";
    (routes || []).forEach(function (route) {
      var el = document.createElement("div");
      el.className = "route" + (route.selected ? " selected" : "");
      el.innerHTML =
        '<span class="mark"></span>' +
        "<div><div><strong>" + escapeHtml(route.name) + "</strong> · " +
        escapeHtml(route.protocol === "openai" ? "Codex" : "Claude") +
        "</div><div class=\"meta\">" +
        escapeHtml(route.provider) + " · " + escapeHtml(route.evidence || route.state || "") +
        " · " + (route.latency_ms != null ? route.latency_ms + " ms" : "--") +
        "</div></div>" +
        "<div class=\"meta\">" + (route.selected ? "当前" : "切换") + "</div>";
      el.addEventListener("click", function () {
        post({ type: "switch_route", index: route.index });
      });
      root.appendChild(el);
    });
    if (!routes || !routes.length) {
      root.innerHTML = '<p class="hint">未发现可用上游</p>';
    }
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var recommendedId = 0;

  window.__hr = {
    applySnapshot: function (snapshot) {
      if (!snapshot || typeof snapshot !== "object") return;
      var mode = snapshot.runtime_mode || "—";
      var pill = $("mode-pill");
      if (pill) {
        pill.textContent = mode;
        pill.className = pillClass(mode);
      }
      setText("st-mode", mode);
      setText("st-reason", snapshot.runtime_reason);
      setText("st-codex", snapshot.codex_summary);
      setText("st-claude", snapshot.claude_summary);
      setText("st-headroom", snapshot.headroom_summary);
      setText("st-recovery", snapshot.recovery_hint);
      setText("st-codex-route", (snapshot.codex_availability || "") + " · " + (snapshot.codex_route || ""));
      setText("st-claude-route", (snapshot.claude_availability || "") + " · " + (snapshot.claude_route || ""));
      var m = snapshot.headroom_metrics || {};
      var savedPct = m.input_tokens_original
        ? ((Number(m.tokens_saved) || 0) * 100 / Number(m.input_tokens_original)).toFixed(1)
        : "0.0";
      var failPct = m.completed_requests
        ? ((Number(m.failed_requests) || 0) * 100 / Number(m.completed_requests)).toFixed(1)
        : "0.0";
      setText(
        "st-tokens",
        compact(m.input_tokens_original) + " → " + compact(m.input_tokens_optimized) +
          " · 节省 " + compact(m.tokens_saved) + "（" + savedPct + "%）"
      );
      setText(
        "st-requests",
        "完成 " + compact(m.completed_requests) + " · 失败 " + compact(m.failed_requests) +
          "（" + failPct + "%）"
      );
      setText("st-metrics-since", snapshot.metrics_since || "当前日志文件累计");
      setText("st-error", snapshot.last_error || "无");

      var recBtn = $("btn-recommended");
      if (snapshot.recommended && snapshot.recommended.id) {
        recommendedId = snapshot.recommended.id;
        if (recBtn) {
          recBtn.disabled = false;
          recBtn.textContent = snapshot.recommended.label || "建议操作";
        }
      } else {
        recommendedId = 0;
        if (recBtn) {
          recBtn.disabled = true;
          recBtn.textContent = "暂无建议操作";
        }
      }

      setCheck("chk-manage", snapshot.manage_upstream);
      setCheck("chk-auto", snapshot.auto_enabled);
      setCheck("chk-bypass", snapshot.bypass_headroom);
      setCheck("chk-startup", snapshot.start_with_windows);
      setCheck("chk-autoupdate", snapshot.auto_update_check);
      setCheck("chk-showkey", snapshot.show_api_key_on_hover);
      setDisabled("btn-sync", snapshot.sync_in_progress);
      setDisabled("btn-restart", snapshot.restart_in_progress);
      setDisabled("btn-update", snapshot.update_running);
      setText("ops-sync", snapshot.sync_status);
      setText("ops-restart", snapshot.restart_status);
      renderRoutes(snapshot.routes);
    }
  };

  document.querySelectorAll("nav.tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var tab = btn.getAttribute("data-tab");
      document.querySelectorAll("nav.tabs button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      document.querySelectorAll("main .panel").forEach(function (panel) {
        panel.classList.toggle("active", panel.id === "tab-" + tab);
      });
    });
  });

  document.querySelectorAll("[data-command]").forEach(function (el) {
    var handler = function (ev) {
      // For checkboxes, still send toggle command; Rust flips and pushes snapshot.
      var id = Number(el.getAttribute("data-command"));
      if (!id) return;
      post({ type: "command", id: id });
    };
    if (el.tagName === "INPUT" && el.type === "checkbox") {
      el.addEventListener("change", handler);
    } else {
      el.addEventListener("click", handler);
    }
  });

  var rec = $("btn-recommended");
  if (rec) {
    rec.addEventListener("click", function () {
      if (recommendedId) post({ type: "command", id: recommendedId });
    });
  }

  post({ type: "ready" });
})();
  </script>
</body>
</html>
