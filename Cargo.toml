[package]
name = "headroom-route"
version = "0.9.3"
edition = "2024"
description = "Lightweight Windows tray route manager for Headroom, Codex and Claude Code"
license = "MIT"

[features]
default = []
desktop = ["dep:wry", "dep:raw-window-handle"]

[[bin]]
name = "HeadroomRoute"
path = "src/main.rs"

[[bin]]
name = "HeadroomRouteCLI"
path = "src/cli.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
httparse = "1.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = { version = "0.23", features = ["serde"] }
url = "2.5"
vt100 = "0.15"
zip = { version = "4.3", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Desktop edition only. Tray edition does not link WebView2.
wry = { version = "0.56", optional = true, default-features = false, features = ["os-webview"] }
raw-window-handle = { version = "0.6", optional = true, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
